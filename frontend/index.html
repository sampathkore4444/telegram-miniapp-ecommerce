<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4338ca" />
  <title>Telegram Shop</title>
  <link rel="stylesheet" href="/css/style.css?v=3" />
</head>
<body>
  <div id="store-bar" class="store-bar hidden">
    <span class="store-bar-label" data-i18n="ui.store">Store</span>
    <select id="store-switch" class="store-switch" disabled></select>
    <span id="store-pill" class="store-pill hidden"></span>
    <button id="store-new" class="store-new hidden" aria-label="New store">+</button>
  </div>
  <div id="app"></div>
  <div id="nav-bar" class="nav-bar hidden" role="navigation">
    <button class="nav-item" data-nav="home">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span><span class="nav-lbl" data-i18n="nav.home">Home</span>
    </button>
    <button class="nav-item" data-nav="cart">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg></span><span class="nav-lbl" data-i18n="nav.cart">Cart</span>
      <span id="cart-badge" class="nav-badge hidden">0</span>
    </button>
    <button class="nav-item" data-nav="orders">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg></span><span class="nav-lbl" data-i18n="nav.orders">Orders</span>
    </button>
    <button class="nav-item" data-nav="profile">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span class="nav-lbl" data-i18n="nav.profile">Profile</span>
    </button>
    <button class="nav-item admin-nav hidden" data-nav="admin">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></span><span class="nav-lbl" data-i18n="nav.admin">Admin</span>
    </button>
  </div>
  <div id="toast-wrap" class="toast-wrap"></div>
  <div id="modal-root"></div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/js/v2/app.js?v=3"></script>
</body>
</html>
